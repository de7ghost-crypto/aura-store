<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <header>
    <nav>
  <a href="index.html" class="logo">AURA</a>
  <a href="shop.html" class="text-link back-link">Back to shop</a>
</nav>
  </header>

  <main class="auth-page">
  <aside class="auth-visual">
    <div class="auth-visual-text">
      <span class="eyebrow">Welcome back</span>
      <h2>Clothes that feel like you.</h2>
      <p>Log in to check out faster and keep track of your orders.</p>
    </div>
  </aside>

  <section class="auth-panel">
    <div class="auth-card">
      <h1>Good to see you again</h1>
      <p class="auth-sub">Log in to pick up where you left off.</p>

      <p id="login-error" class="login-error hidden"></p>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <button type="submit" class="btn">Log in</button>
      </form>

      <p class="switch-auth">New here? <a href="register.html">Create an account</a></p>
    </div>
  </section>
</main>
  
  <script src="js/config.js"></script>
  <script src="js/customer-login.js"></script>
</body>
</html>
